# PostgreSQL для локальной разработки. Логин/пароль/порт совпадают
# со строкой подключения в src/RoomBook.Api/appsettings.json.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roombook
    ports:
      - "5432:5432"
    volumes:
      - roombook-db:/var/lib/postgresql/data

volumes:
  roombook-db:
